<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>StrokeCare AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .warm-ivory-gradient {
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #f4fafd 100%);
        }
        .editorial-shadow {
            box-shadow: 0 20px 40px rgba(137, 45, 50, 0.04);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(220, 192, 191, 0.3);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#3b0900",
                        "primary": "#892d32",
                        "surface-container-low": "#eef5f7",
                        "primary-fixed-dim": "#ffb3b2",
                        "tertiary": "#735c00",
                        "on-tertiary": "#ffffff",
                        "secondary": "#99452c",
                        "on-primary-container": "#ffdad9",
                        "tertiary-container": "#cba72f",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#dde4e6",
                        "inverse-on-surface": "#ebf2f4",
                        "tertiary-fixed-dim": "#e9c349",
                        "on-primary-fixed-variant": "#81272c",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#564242",
                        "on-tertiary-fixed": "#241a00",
                        "secondary-fixed-dim": "#ffb5a0",
                        "outline-variant": "#dcc0bf",
                        "secondary-container": "#ff9475",
                        "surface-bright": "#f4fafd",
                        "surface": "#f4fafd",
                        "outline": "#897271",
                        "inverse-primary": "#ffb3b2",
                        "secondary-fixed": "#ffdbd1",
                        "primary-container": "#a84448",
                        "surface-tint": "#a03e42",
                        "inverse-surface": "#2b3234",
                        "surface-container-high": "#e2e9ec",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#762b14",
                        "surface-container": "#e8eff1",
                        "on-primary-fixed": "#410008",
                        "background": "#f4fafd",
                        "primary-fixed": "#ffdad9",
                        "tertiary-fixed": "#ffe088",
                        "on-tertiary-container": "#4e3d00",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#574500",
                        "on-surface": "#161d1f",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-background": "#161d1f",
                        "surface-variant": "#dde4e6",
                        "on-secondary-fixed-variant": "#7b2e17",
                        "surface-dim": "#d4dbdd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "section-gap": "64px",
                        "gutter": "24px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "unit": "8px",
                        "container-padding": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "caption": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "0em", "fontWeight": "500"}],
                        "caption": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400"}],
                        "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.1em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["26px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background font-body-md text-on-background warm-ivory-gradient selection:bg-primary/10 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
