$schema: 'https://moonrepo.dev/schemas/tasks.json'

fileGroups:
  sources:
    - 'src/**/*'
    - 'package.json'
  tests:
    - 'tests/**/*'
    - '**/*.test.*'

tasks:
  check:
    command: 'biome check .'
    inputs:
      - '@globs(sources)'
      - '/biome.json'
   
  lint:
    command: 'biome lint .'
    inputs:
      - '@globs(sources)'
      - '/biome.json'
      
  format:
    command: 'biome format --write .'
    inputs:
      - '@globs(sources)'
      - '/biome.json'
