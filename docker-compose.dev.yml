name: strokecare-dev

services:
  db:
    image: postgres:16-alpine
    container_name: storkecareai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stroke_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stroke_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: storkecareai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  apps:
    image: storkecareai/apps:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: storkecareai-apps
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/stroke_ai
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: dev-only-secret-replace-in-production-32chars
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:5173
      PORT: "3001"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-sk-or-v1-placeholder}
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
